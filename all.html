<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Records - Indian Railways</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }
        .header {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            padding: 30px 0;
            margin-bottom: 40px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .header img {
            height: 60px;
            margin-right: 15px;
        }
        .header h1 {
            font-size: 2.5rem;
            font-weight: bold;
        }
        .table-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .table thead {
            border-radius: 10px;
        }
        .btn-home {
            border-radius: 50px;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header text-center">
        <div class="container d-flex align-items-center justify-content-center">
            <img src="{{ url_for('static', filename='rail.jpg') }}" alt="Railways Logo">
            <div>
                <h1>Indian Railways</h1>
                <p class="lead">Unified Portal System</p>
            </div>
        </div>
    </div>

    <!-- Table Section -->
    <div class="container">
        <div class="table-container">
            <h2 class="mb-4 text-center text-primary">All Fittings</h2>
            <div class="table-responsive">
                <table class="table table-striped table-bordered shadow-sm">
                    <thead class="table-dark">
                        <tr>
                            <th>UID</th>
                            <th>Item Type</th>
                            <th>Vendor</th>
                            <th>Repair Date</th>
                            <th>Risk</th>
                            <th>Next Inspection</th>
                            <th>View</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in rows %}
                        <tr>
                            <td>{{ row.uid }}</td>
                            <td>{{ row.item_type }}</td>
                            <td>{{ row.vendor }}</td>
                            <td>{{ row.repair_date or "N/A" }}</td>
                            <td>{{ row.risk or "N/A" }}</td>
                            <td>{{ row.next_inspection }}</td>
                            <td><a href="/view/{{ row.uid }}" class="btn btn-sm btn-primary">Details</a></td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <div class="text-center mt-4">
                <a href="/" class="btn btn-outline-secondary btn-home">⬅ Back Home</a>
            </div>
        </div>
    </div>
</body>
</html>
